<style>
:root{--g:#0b4a43;--g2:#0e6b5f;--t:#118b7f;--gold:#e0a526;--bg:#eef3f1;--card:#fff;--ink:#10231f;--mut:#5a716b;--ln:#dbe5e1;--sh:0 10px 30px -14px rgba(11,74,67,.35);--danger:#c0392b;--ff:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#0a1512;--card:#112019;--ink:#e6f1ed;--mut:#93aca4;--ln:#233a33;--sh:0 10px 30px -14px rgba(0,0,0,.7);--t:#2bb3a3;--danger:#ff7a6b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 var(--ff);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;touch-action:manipulation}input,textarea,select{font:inherit;color:inherit}
.ic{display:inline-grid;place-items:center;flex:none}[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);font-weight:700;font-size:.9rem;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--t);box-shadow:var(--sh)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--t),var(--g2));color:#fff;border-color:transparent}.btn.d{color:var(--danger)}.btn.d:hover{border-color:var(--danger)}
.btn:disabled{opacity:.55;pointer-events:none}.btn.s{padding:7px 12px;font-size:.82rem;border-radius:10px}
.ca{flex-wrap:wrap}.ca .btn.s{white-space:nowrap;flex:1 1 128px;min-width:0;justify-content:center;gap:6px;padding:7px 8px;font-size:.78rem}.ca .btn.s svg{flex:none}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{position:relative;overflow:hidden;color:#fff;padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:center;gap:18px;background:radial-gradient(circle at 85% 12%,rgba(224,165,38,.28),transparent 42%),linear-gradient(150deg,#073b35,#0e6b5f)}
.hero::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-180px;bottom:-200px;border:60px solid rgba(255,255,255,.06)}
.hero img{width:76px;height:76px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.hero h1{margin:0;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.15}.hero p{margin:0;max-width:34ch;opacity:.88}
.hero ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}.hero li{display:flex;gap:10px;align-items:center;opacity:.92}.hero li .ic{background:rgba(255,255,255,.14);border-radius:10px;padding:6px}
.lgc{display:grid;place-items:center;padding:24px}.lgb{width:min(100%,400px);animation:up .5s ease both}
.lgb h2{margin:0 0 4px;font-size:1.6rem}.lgb>p{margin:0 0 22px;color:var(--mut)}
.fl{display:grid;gap:6px;margin-bottom:14px;font-size:.84rem;font-weight:600;color:var(--mut)}
.inp{width:100%;font-weight:500;color:var(--ink);padding:12px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:0;border-color:var(--t);box-shadow:0 0 0 4px color-mix(in srgb,var(--t) 20%,transparent)}
.pw{position:relative}.pw .inp{padding-right:48px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:8px;border-radius:8px}
.err{min-height:1.3em;color:var(--danger);font-size:.86rem;margin:0 0 10px;font-weight:600}.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:linear-gradient(180deg,#073b35,#0b4a43);color:#fff}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.brand img{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);padding:5px;flex:none}.brand b{display:block;line-height:1.2}.brand small{opacity:.7;font-size:.74rem}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-radius:12px;background:none;color:rgba(255,255,255,.82);font-weight:600;text-align:left;transition:background .2s,color .2s,transform .15s}
.nv:hover{background:rgba(255,255,255,.1);color:#fff}.nv[aria-current=page]{background:#fff;color:var(--g);box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.mo{display:none}a.nv,a.sc,a.btn{text-decoration:none}.sp{flex:1}.usr{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#3b2800;display:grid;place-items:center;font-weight:800}.usr .av{flex:none;width:38px}.usr div:not(.av){min-width:0;flex:1;line-height:1.25}.usr b,.usr small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.usr small{opacity:.7;font-size:.76rem}
.row2{display:flex;gap:8px}.row2 .nv{flex:1;justify-content:center;padding:9px;font-size:.84rem}
.brand{gap:8px;padding-right:2px}.brand>div{min-width:0}.card[draggable=true]{cursor:grab}.card.dov{outline:2px dashed var(--t);outline-offset:3px}.brand b{white-space:nowrap}.sbt{margin-left:auto;flex:none;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:background .2s}
.sbt:hover{background:rgba(255,255,255,.22)}.sbt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(min-width:861px){
.shell{transition:grid-template-columns .25s ease}
.shell.mini{grid-template-columns:80px 1fr}
.mini .side{padding:20px 10px;align-items:stretch}
.mini .brand{flex-direction:column;gap:12px;padding:4px 0 14px}.mini .brand>div{display:none}.mini .sbt{margin-left:0}
