<title>Verifikasi Sertifikat Lomba HSN 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7f5;--card:#fff;--tx:#17302a;--mut:#6b7f78;--pri:#178888;--gold:#b87a0e;--bd:#dce6e1;--ok:#15803d;--okbg:#e8f5ec;--bad:#b91c1c;--badbg:#fdecec;--track:#e3ece8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--tx:#e6f1ed;--mut:#8fa59d;--pri:#2dd4bf;--gold:#e0b556;--bd:#26372f;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#341616;--track:#23332d}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--tx:#e6f1ed;--mut:#8fa59d;--pri:#2dd4bf;--gold:#e0b556;--bd:#26372f;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#341616;--track:#23332d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{text-align:center;margin:8px 0 18px}
.logo{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:2px 10px}
.logo img{display:block;height:64px;width:auto}
h1{font-size:1.3rem;margin:12px 0 2px}
header p{margin:0;color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{font-size:.85rem;color:var(--mut);display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
input:focus{outline:2px solid var(--pri);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:10px 18px;font-weight:600}
:root[data-theme="dark"] button{color:#06241f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#06241f}}
button:disabled{opacity:.6;cursor:wait}
.hint{font-size:.78rem;color:var(--mut);margin:8px 0 0}
#res{display:none}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:14px}
.st .ic{font-size:1.6rem;line-height:1}
.st b{display:block;font-size:1.05rem}
.st span{font-size:.85rem}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.no{background:var(--badbg);color:var(--bad)}
dl{margin:0}
.it{padding:9px 0;border-top:1px solid var(--bd)}
.it dt{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.it dd{margin:2px 0 0;font-weight:600}
.it dd.name{font-size:1.2rem;color:var(--gold)}
footer{text-align:center;font-size:.76rem;color:var(--mut);margin:18px 0 6px}
</style>

  <p>Lomba Hari Santri Nasional 2026 · MWC NU Kecamatan Citeureup</p>

<div class="card">
  <label for="no">Nomor Sertifikat</label>
  <div class="row">
    <input id="no" placeholder="mis. 012/PAN-HSN/MWC-NU/X/2026" autocomplete="off" autocapitalize="characters">
    <button id="go">Periksa</button>
  </div>
  <p class="hint">Nomor tercetak di bagian atas sertifikat. Jika Anda memindai QR, nomor terisi otomatis.</p>

<div class="card" id="res" aria-live="polite"></div>
<footer>Panitia HSN 2026 · Santri Menguatkan Negeri Menuju Indonesia Emas</footer>
</div>
<script>
// URL Web App Apps Script (sama dengan di index.html). Harus mendukung ?action=verify&no=...
const API="https://script.google.com/macros/s/AKfycbzRjyEOaQrIvNziA-CDe5tB_zOW8j6Es6MdHmnHwUVXLxsSVOj62uRKm3xWBWL6n0Kr/exec";
// Data contoh untuk uji tampilan selama API belum diisi
const DEMO=[{no:"001/PAN-HSN/MWC-NU/X/2026",nama:"Muhammad Fulan",kategori:"Azan",tanggal:"24 - 25 Oktober 2026",lembaga:"TPQ Al-Hidayah"}];

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).trim().toUpperCase().replace(/\s+/g,"");

function show(html){const r=$("res");r.innerHTML=html;r.style.display="block"}
function found(d){
  const f=(k,v)=>v?`<div class="it"><dt>${k}</dt><dd>${esc(v)}</dd></div>`:"";
  show(`<div class="st ok"><div class="ic">✔</div><div><b>Sertifikat Asli &amp; Terdaftar</b><span>Data ditemukan di arsip panitia.</span></div></div>
  <dl>${f("Nomor",d.no)}<div class="it"><dt>Diberikan kepada</dt><dd class="name">${esc(d.nama)}</dd></div>
  ${f("Kategori Lomba",d.kategori)}${f("Asal / Lembaga",d.lembaga)}${f("Tanggal Pelaksanaan",d.tanggal)}${f("Jenis","Sertifikat Partisipasi")}</dl>`);
}
function notFound(){
  show(`<div class="st no"><div class="ic">✖</div><div><b>Sertifikat Tidak Ditemukan</b><span>Periksa kembali nomor yang dimasukkan, atau hubungi panitia.</span></div></div>`);
}
async function check(){
  const v=$("no").value.trim();
  if(!v){$("no").focus();return}
  const b=$("go");b.disabled=true;b.textContent="Memeriksa…";
  try{
    let d=null;
    if(API.startsWith("PASTE")){d=DEMO.find(x=>norm(x.no)===norm(v))||null}
    else{const r=await fetch(API+"?action=verify&no="+encodeURIComponent(v));const j=await r.json();d=j&&j.found?j.data:null}
    d?found(d):notFound();
  }catch(e){
    show(`<div class="st no"><div class="ic">!</div><div><b>Gagal terhubung</b><span>Coba lagi beberapa saat.</span></div></div>`);
  }
  b.disabled=false;b.textContent="Periksa";
}
$("go").onclick=check;
$("no").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
const q=new URLSearchParams(location.search).get("no");
if(q){$("no").value=q;check()}
</script>
