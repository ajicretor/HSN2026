<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Progres Panitia HSN 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7f5;--card:#fff;--tx:#17302a;--mut:#6b7f78;--pri:#0f766e;--bd:#dce6e1;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--track:#e3ece8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--tx:#e6f1ed;--mut:#8fa59d;--pri:#2dd4bf;--bd:#26372f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--track:#23332d}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--tx:#e6f1ed;--mut:#8fa59d;--pri:#2dd4bf;--bd:#26372f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--track:#23332d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}.logo{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:2px 8px}.logo img{display:block;height:64px;width:auto}header.hd p{margin:2px 0 0}header h1{font-size:1.35rem;margin:0}
header p{margin:2px 0 14px;color:var(--mut);font-size:.9rem}
.msg{display:none;margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--track);font-size:.88rem}.msg.bad{color:var(--bad);border:1px solid var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.total{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.big{font-size:2.2rem;font-weight:700;color:var(--pri)}
.grow{flex:1;min-width:180px}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sie{cursor:pointer;transition:border-color .2s}
.sie.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.sie h3{margin:0;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.koor{color:var(--mut);font-size:.85rem;margin:2px 0 10px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut);margin-top:6px}
.badge{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.b-ok{color:var(--ok)}.b-run{color:var(--pri)}.b-new{color:var(--mut)}.b-bad{color:var(--bad)}
#detail{margin-top:16px}
#detail h2{margin:0 0 2px;font-size:1.15rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input.t{flex:1;min-width:180px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme="dark"] button.p{color:#06241f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#06241f}}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none}
.task .n{flex:1}
.task.done .n{text-decoration:line-through;color:var(--mut)}
.due{font-size:.78rem;color:var(--mut);white-space:nowrap}
.due.late{color:var(--bad);font-weight:600}
.x{border:none;background:none;color:var(--mut);padding:4px 8px}
footer{margin:18px 0 6px;font-size:.78rem;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
<header class="hd"><div class="logo"><img alt="Logo Hari Santri 2026" src="logo.png"></div><div><h1>Monitoring Progres Panitia HSN 2026</h1><p>Kecamatan Citeureup · Santri Menguatkan Negeri Menuju Indonesia Emas</p></div></header>
<div id="msg" class="msg"></div>
<div class="card total">
  <div class="big" id="tp">0%</div>
  <div class="grow"><div class="bar"><i id="tb"></i></div><div class="meta"><span id="tc"></span><span id="tl"></span></div></div>
</div>
<div class="grid" id="grid"></div>
<div class="card" id="detail"></div>
<footer><span>Data tersinkron dengan Google Sheets (diperbarui otomatis tiap 30 detik).</span><button id="rf">Muat ulang</button></footer>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbzRjyEOaQrIvNziA-CDe5tB_zOW8j6Es6MdHmnHwUVXLxsSVOj62uRKm3xWBWL6n0Kr/exec"; // contoh: https://script.google.com/macros/s/AKfy.../exec
let S={seksi:[],tugas:[]},sel=null,kode=localStorage.getItem("hsn_kode")||"";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=new Date().toISOString().slice(0,10);
const tk=id=>S.tugas.filter(t=>t.sid===id);
const late=t=>!t.done&&t.due&&t.due<today;
const pct=s=>{const t=tk(s.id);return t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0};
const status=s=>{const t=tk(s.id),p=pct(s);if(t.some(late))return["Ada yang terlambat","b-bad"];
 if(t.length&&p===100)return["Selesai","b-ok"];if(p===0)return["Belum mulai","b-new"];return["Berjalan","b-run"]};
function msg(t,bad){const m=$("msg");m.textContent=t;m.style.display=t?"block":"none";m.className="msg"+(bad?" bad":"")}
async function load(quiet){
  if(API.startsWith("PASTE")){msg("Isi dulu konstanta API di index.html dengan URL Web App Apps Script.",1);return}
  try{const r=await fetch(API);const j=await r.json();if(j.error)throw 0;S=j;
   if(!S.seksi.find(x=>x.id===sel))sel=S.seksi[0]&&S.seksi[0].id;msg("");render()}
  catch(e){if(!quiet)msg("Gagal memuat data dari Google Sheets. Periksa URL API dan pengaturan deploy.",1)}
}
async function send(d){
  if(!kode)kode=prompt("Masukkan kode panitia untuk mengubah data:")||"";
  if(!kode){load();return}
  msg("Menyimpan…");
  try{const r=await fetch(API,{method:"POST",body:JSON.stringify({...d,kode})});const j=await r.json();
   if(j.error==="kode"){kode="";localStorage.removeItem("hsn_kode");msg("Kode panitia salah.",1);load(true);return}
   if(j.error){msg(j.error,1);return}
   localStorage.setItem("hsn_kode",kode);S=j;msg("");render()}
  catch(e){msg("Gagal menyimpan. Periksa koneksi lalu coba lagi.",1);load(true)}
}
function render(){
  const all=S.tugas,dn=all.filter(t=>t.done).length,tp=all.length?Math.round(dn/all.length*100):0;
  $("tp").textContent=tp+"%";$("tb").style.width=tp+"%";
  $("tc").textContent=`${dn} dari ${all.length} tugas selesai`;
  const lt=all.filter(late).length;$("tl").textContent=lt?`${lt} tugas terlambat`:"";
  $("grid").innerHTML=S.seksi.map(s=>{const[st,c]=status(s),p=pct(s),t=tk(s.id);
   return `<div class="card sie ${s.id===sel?"sel":""}" data-id="${s.id}"><h3>${esc(s.name)}<span class="badge ${c}">${st}</span></h3>
   <div class="koor">Koordinator: ${s.koor?esc(s.koor):"<i>belum diisi</i>"}</div><div class="bar"><i style="width:${p}%"></i></div>
   <div class="meta"><span>${t.filter(x=>x.done).length}/${t.length} tugas</span><b>${p}%</b></div></div>`}).join("");
  const s=S.seksi.find(x=>x.id===sel);if(!s){$("detail").innerHTML="";return}
  const t=tk(s.id);
  $("detail").innerHTML=`<h2>Seksi ${esc(s.name)} — ${pct(s)}%</h2>
  <div class="row"><input id="kn" placeholder="Nama koordinator" value="${esc(s.koor)}"><button id="ks">Simpan nama</button></div>
  <div class="row"><input class="t" id="nt" placeholder="Tambah tugas / kegiatan baru"><input type="date" id="nd" title="Tenggat"><button class="p" id="na">Tambah</button></div>
  ${t.length?t.map(x=>`<div class="task ${x.done?"done":""}"><input type="checkbox" data-i="${x.id}" ${x.done?"checked":""}>
   <span class="n">${esc(x.t)}</span>${x.due?`<span class="due ${late(x)?"late":""}">${late(x)?"Lewat · ":"Tenggat "}${x.due.split("-").reverse().join("/")}</span>`:""}
   <button class="x" data-d="${x.id}" title="Hapus">✕</button></div>`).join(""):"<p class='koor'>Belum ada tugas.</p>"}`;
}
$("grid").onclick=e=>{const c=e.target.closest(".sie");if(c){sel=c.dataset.id;render()}};
$("detail").onclick=e=>{const g=e.target;
 if(g.id==="ks")send({action:"setKoor",sid:sel,koor:$("kn").value.trim()});
 else if(g.id==="na"){const v=$("nt").value.trim();if(v)send({action:"addTask",sid:sel,t:v,due:$("nd").value})}
 else if(g.dataset.d){if(confirm("Hapus tugas ini?"))send({action:"delTask",id:g.dataset.d})}
 else if(g.dataset.i){const t=S.tugas.find(x=>x.id===g.dataset.i);t.done=g.checked;render();send({action:"toggle",id:t.id,done:g.checked})}};
$("rf").onclick=()=>load();
msg("Memuat data…");load();
setInterval(()=>{if(!/INPUT/.test(document.activeElement.tagName))load(true)},30000);
</script>
</body>
</html>
